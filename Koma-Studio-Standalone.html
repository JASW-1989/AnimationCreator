<script>/* Original local-only animation extensions. No network, model SDK or dynamic plugin loader. */
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.KomaPlugins=factory();})(typeof globalThis!=='undefined'?globalThis:this,function(){

const idOK=s=>typeof s==='string'&&/^[a-z][a-z0-9_-]{0,63}$/.test(s);
const imageOK=s=>typeof s==='string'&&s.length<6000000&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s);
const limbs=['fore_near','fore_far','hind_near','hind_far'];
const catalog=[
 {id:'vault',name:'Local Vault',version:'0.2.0',offline:true,network:false,capabilities:['persistent-undo-redo','checkpoints','checksum-backup'],status:'builtin'},
 {id:'celstack',name:'Cel Stack',version:'0.2.0',offline:true,network:false,capabilities:['raster-cel-library','exposure-ranges','repeat','blank-cels'],status:'builtin'},
 {id:'clipshelf',name:'Clip Shelf',version:'0.2.0',offline:true,network:false,capabilities:['capture','retime','repeat','collision-check'],status:'builtin'},
 {id:'contact',name:'Contact IK',version:'0.2.0',offline:true,network:false,capabilities:['two-link-ik','world-target','ground-velocity','reach-diagnostics'],status:'builtin',scope:'Built-in cat limbs; no automatic rigging of imported art.'},
 {id:'renderpack',name:'Render Pack',version:'0.2.0',offline:true,network:false,capabilities:['lossless-apng','png-sequence','cancel','immutable-render-source'],status:'builtin'}
];
const ops=['import_cels','set_cel_range','capture_clip','apply_clip','delete_clip','set_contact','remove_contact'];
function layer(p,id){const l=p.layers.find(x=>x.id===id);if(!l)error('Unknown layer '+id);return l;}
function editable(p,id){const l=layer(p,id);if(l.locked||(l.parent&&layer(p,l.parent).locked))error('Layer or parent is locked: '+id);return l;}
function valuesAt(l,f){const v=C.evaluateLayer(l,f);if(!C.DRAWINGS[l.id])delete v.drawing;return v;}
function range(p,start,end){int(start,0,p.frames-1,'start');int(end,start,p.frames-1,'end');}
function checkCel(l){if(!l.cels||!l.exposures)error('Select a cel layer');}
function validate(p){
 for(const l of p.layers){if(l.cels===undefined&&l.exposures===undefined)continue;
  if(l.type!=='raster'||!Array.isArray(l.cels)||l.cels.length<1||l.cels.length>120)error('Invalid cel library');
  const ids=new Set();for(const a of l.cels){if(!idOK(a.id)||ids.has(a.id)||typeof a.name!=='string'||a.name.length>120||!imageOK(a.data))error('Invalid cel asset');ids.add(a.id);}
  if(!Array.isArray(l.exposures)||l.exposures.length>p.frames)error('Invalid exposures');let prev=-1;
  for(const e of l.exposures){range(p,e.start,e.end);if(e.start<=prev||!ids.has(e.cel))error('Overlapping or invalid exposure');prev=e.end;}
 }
 if(p.clips!==undefined){if(!Array.isArray(p.clips)||p.clips.length>24)error('At most 24 clips');const ids=new Set();for(const clip of p.clips){
  if(!idOK(clip.id)||ids.has(clip.id)||typeof clip.name!=='string'||clip.name.length>120)error('Invalid clip identity');ids.add(clip.id);int(clip.length,1,480,'clip length');
  if(!Array.isArray(clip.tracks)||!clip.tracks.length||clip.tracks.length>24)error('Invalid clip tracks');const tracks=new Set();
  for(const t of clip.tracks){const l=layer(p,t.layer);if(tracks.has(t.layer))error('Duplicate clip track');tracks.add(t.layer);
   if(!Array.isArray(t.keys)||t.keys.length<1||t.keys.length>480)error('Invalid clip keys');let prev=-1;
   for(const k of t.keys){int(k.frame,0,clip.length-1,'clip key');if(k.frame<=prev)error('Clip keys must be sorted and unique');prev=k.frame;
    if(!['hold','linear','ease'].includes(k.interpolation)||!k.values||Array.isArray(k.values))error('Invalid clip key values');
    for(const [prop,v]of Object.entries(k.values)){if(prop==='drawing'){if(!C.DRAWINGS[l.id]?.includes(v))error('Invalid clip drawing');}else{if(!C.TRANSFORMS[prop])error('Invalid clip property');finite(v,...C.TRANSFORMS[prop],prop);}}
   }
  }
 }}
 if(p.contacts!==undefined){if(!Array.isArray(p.contacts)||p.contacts.length>64)error('At most 64 contacts');const ids=new Set();for(const a of p.contacts){
  if(!idOK(a.id)||ids.has(a.id)||!limbs.includes(a.layer))error('Invalid contact identity');ids.add(a.id);range(p,a.start,a.end);finite(a.x,-2000,3000,'contact x');finite(a.y,-2000,3000,'contact y');

 if(c.op==='import_cels'){
  if(!idOK(c.layer)||p.layers.some(l=>l.id===c.layer))error('New cel layer ID must be unique');

 }else if(c.op==='set_cel_range'){
  const l=editable(p,c.layer);checkCel(l);range(p,c.start,c.end);if(c.cel!==null&&!l.cels.some(a=>a.id===c.cel))error('Unknown cel');const before=copy(l.exposures),out=[];
  for(const e of l.exposures){if(e.end<c.start||e.start>c.end)out.push(e);else{if(e.start<c.start)out.push({...e,end:c.start-1});if(e.end>c.end)out.push({...e,start:c.end+1});}}
  if(c.cel!==null)out.push({start:c.start,end:c.end,cel:c.cel});l.exposures=mergeExposures(out);changes.push({target:c.layer+'.exposures',before,after:copy(l.exposures)});
 }else if(c.op==='capture_clip'){
  range(p,c.start,c.end);if(!idOK(c.id)||typeof c.name!=='string'||c.name.length>120)error('Invalid clip name');if(p.clips?.some(x=>x.id===c.id))error('Clip ID already exists');
  if(!Array.isArray(c.layers)||c.layers.length<1||c.layers.length>24||new Set(c.layers).size!==c.layers.length)error('Choose 1..24 unique layers');

  const clip={id:c.id,name:c.name,length:c.end-c.start+1,tracks,sampling:'one-sample-per-logical-frame'};(p.clips??=[]).push(clip);changes.push({target:'clips.'+c.id,before:null,after:{name:c.name,length:clip.length,layers:c.layers}});
 }else if(c.op==='apply_clip'){
  const clip=p.clips?.find(x=>x.id===c.id);if(!clip)error('Unknown clip');int(c.start,0,p.frames-1,'start');int(c.duration,1,p.frames,'duration');int(c.repeat,1,p.frames,'repeat');
  const end=c.start+c.duration*c.repeat-1;if(end>=p.frames)error('Repeated clip exceeds scene');if(!['error','replace'].includes(c.collision))error('Choose collision error or replace');

   // Deterministic nearest-sample retiming preserves original drawings (no invented morphing).
   for(let rep=0;rep<c.repeat;rep++)for(let i=0;i<c.duration;i++){const src=c.duration===1?0:Math.round(i*(clip.length-1)/(c.duration-1));const sample=t.keys.filter(k=>k.frame<=src).at(-1)||t.keys[0];keys.push({frame:c.start+rep*c.duration+i,values:copy(sample.values),interpolation:'hold'});}

el.innerHTML=`<header class="cine-header"><div class="cine-logo">KOMA <span style="color:#9aaea5">CINEMA</span></div><span class="cine-version">0.3 PREVIEW / LOCAL WORKBENCH</span><div class="spacer"></div><button id="cineSave">\u5132\u5b58\u5c08\u6848</button><button id="cinePng">PNG</button><button id="cineClose">\u8fd4\u56de\u5de5\u4f5c\u53f0</button></header>
<div class="cine-main"><main><div class="cine-kicker">ORIGINAL CINEMATIC STUDY / 001</div><h1 class="cine-name">\u9918\u71fc\u4e4b\u9580 <span style="color:#8fa59b;font-size:15px;letter-spacing:3px">EMBER GATE</span></h1><div class="cine-description">6 \u500b\u93e1\u982d\uff0f12 \u79d2\uff0f24 fps \u2014 \u651d\u5f71\u5408\u6210\u8207\u7bc0\u594f\u9810\u6f14\uff0c\u4e0d\u662f\u5b8c\u6210\u7684\u5546\u696d\u4f5c\u756b\u3002</div><div class="cine-picture"><div id="cinemaStage" style="width:100%;height:100%"></div></div><div class="cine-toolbar"><button id="cinePlay" aria-label="Play sequence">\u64ad\u653e</button><button id="cinePrev" aria-label="Previous frame">\u2039</button><button id="cineNext" aria-label="Next frame">\u203a</button><input id="cineSeek" type="range" min="0" max="287" value="0" aria-label="Sequence frame"><code id="cineTime" class="cine-time"></code></div><div class="cine-views"><button data-cine-view="composite" class="active">\u5408\u6210\u5b8c\u6210</button><button data-cine-view="base">\u79fb\u9664\u7279\u6548</button><button data-cine-view="plates">\u56fa\u5b9a\u651d\u5f71\u6a5f</button><span>INSPECT THE WORK, NOT THE GLOW</span></div><div class="cine-shots" id="cineShots"></div><div class="cine-note" id="cineNote"></div></main><aside class="cine-aside"><section><div class="cine-kicker">01 / SHOT BOARD</div><h3 id="cineShotTitle"></h3><p id="cineShotMeta"></p><div class="cine-actions"><button id="cineUndo">\u64a4\u92b7</button><button id="cineRedo">\u91cd\u505a</button><button id="cineExport">APNG / ZIP</button></div><p class="cine-warning">\u52d5\u4f5c\u93e1\u982d\u4f7f\u7528 5 \u5f35\u660e\u78ba\u63db\u756b\u3002\u672a\u505a\u901a\u7528\u9aa8\u67b6\u3001\u88dc\u756b\u6216\u8ffd\u8e64\u3002</p></section><section><div class="cine-kicker">02 / CAMERA &amp; LAYERS</div><h3>\u93e1\u982d\u7d50\u5c3e\u69cb\u5716</h3><label>X<input id="cineCamX" type="number" min="-2000" max="2000" step="1"></label><label>Y<input id="cineCamY" type="number" min="-2000" max="2000" step="1"></label><label>Zoom<input id="cineCamZoom" type="number" min="0.1" max="8" step="0.01"></label><button id="cineApplyCamera">\u5957\u7528\u6b64\u93e1\u982d</button><div id="cineLayers" class="cine-layers"></div><label>\u4e3b\u9ad4\u6bcf\u5f35\u756b\u4fdd\u6301<select id="cineExposure"><option value="1">1 \u683c</option><option value="2">2 \u683c</option><option value="3">3 \u683c</option><option value="4">4 \u683c</option></select></label><p>\u651d\u5f71\u6a5f\u4e0d\u8ddf\u8457\u756b\u7a3f\u66dd\u5149\u505c\u683c\uff1b\u666f\u6df1\u70ba 2D \u591a\u5c64\u8996\u5dee\uff0c\u975e 3D \u74b0\u7e5e\u3002</p></section><section><div class="cine-kicker">03 / COMPOSITE REVIEW</div><h3>\u4e00\u500b\u6548\u679c\uff0c\u4e00\u500b\u958b\u95dc</h3><div id="cineEffects"></div><p>\u7279\u6548\u4f7f\u7528\u56fa\u5b9a\u4e82\u6578\u7a2e\u5b50\u3002\u63d0\u4f9b\u5206\u96e2\u8a55\u6aa2\u7684\u662f\u7bc0\u9ede\u6e05\u55ae\uff0c\u4e0d\u662f\u5b8c\u6574\u7bc0\u9ede\u7de8\u8f2f\u5668\u3002</p><div id="cineError" class="cine-error"></div></section></aside></div><footer class="cine-bottom"><span id="cineRevision"></span><span>ZERO NETWORK / ORIGINAL ART / NO MODEL CALLS</span><span>960 x 540 LOGICAL CANVAS</span></footer>`;
document.body.appendChild(el);const $=id=>document.getElementById(id),escape=Core.clone?x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])):String;
const btn=document.createElement('button');btn.id='openCinema';btn.textContent='\u5e8f\u5217\u651d\u5f71 / \u65b0\u6848\u4f8b';btn.className='cine-btn';document.querySelector('.top-actions').prepend(btn);
async function edit(commands){try{const plan=await S.preview(commands);await S.commit(plan.id,plan.baseRevision);$('cineError').textContent='';refresh();}catch(e){$('cineError').textContent=e.message;}}
function stop(){run=false;cancelAnimationFrame(raf);$('cinePlay').textContent='\u64ad\u653e';}
function seek(f){localFrame=f;S.seek(f);refresh();}
function shot(){const p=S.read().project;return p.cinema?Cine.shotAt(p.cinema,localFrame):null;}
function refresh(){if(el.hidden)return;const state=S.read(),p=state.project;if(!p.cinema){el.hidden=true;return;}localFrame=Math.min(localFrame,p.frames-1);const e=Cine.evaluate(p.cinema,localFrame),s=e.shot;
 $('cinemaStage').innerHTML=Cine.renderSVG(p,localFrame,{cinemaMode:viewMode});$('cineSeek').max=p.frames-1;$('cineSeek').value=localFrame;$('cineTime').textContent=String(Math.floor(localFrame/p.fps)).padStart(2,'0')+':'+String(localFrame%p.fps).padStart(2,'0')+' / '+p.frames+'f';$('cineRevision').textContent='REV '+state.revision+' / '+s.id.toUpperCase()+' / FRAME '+String(localFrame).padStart(3,'0');
 if(currentShot!==s.id||currentRevision!==state.revision){currentShot=s.id;currentRevision=state.revision;
 $('cineShotTitle').textContent=s.name;$('cineShotMeta').textContent=s.start+'\u2013'+(s.end-1)+'f / '+((s.end-s.start)/p.fps).toFixed(2)+'s';$('cineNote').textContent=s.note;
 const cv=Cine.sample(s.camera,s.end-s.start-1);$('cineCamX').value=cv.x;$('cineCamY').value=cv.y;$('cineCamZoom').value=cv.zoom;
 const actor=s.layers.find(l=>['actor','pose','eyes'].includes(l.id));$('cineExposure').disabled=!actor;if(actor)$('cineExposure').value=actor.hold;
 $('cineLayers').innerHTML=s.layers.map(l=>`<label><input type="checkbox" data-cine-layer="${l.id}" ${l.visible?'checked':''}>${escape(l.name)}<code>${l.depth.toFixed(2)}z</code></label>`).join('');
 $('cineLayers').querySelectorAll('input').forEach(i=>i.onchange=()=>edit([{op:'cinema_set_layer',shot:s.id,layer:i.dataset.cineLayer,property:'visible',value:i.checked}]));
 $('cineEffects').innerHTML=s.effects.map(e=>`<label><input type="checkbox" data-cine-fx="${e.id}" ${e.enabled?'checked':''}>${e.kind}<input aria-label="${e.kind} amount" data-cine-fx-amount="${e.id}" type="range" min="0" max="1" step=".05" value="${e.amount}"></label>`).join('');
 $('cineEffects').querySelectorAll('[data-cine-fx]').forEach(i=>i.onchange=()=>edit([{op:'cinema_set_effect',shot:s.id,effect:i.dataset.cineFx,property:'enabled',value:i.checked}]));
 $('cineEffects').querySelectorAll('[data-cine-fx-amount]').forEach(i=>i.onchange=()=>edit([{op:'cinema_set_effect',shot:s.id,effect:i.dataset.cineFxAmount,property:'amount',value:Number(i.value)}]));
 $('cineShots').innerHTML=p.cinema.shots.map(q=>`<button data-cine-shot="${q.id}" class="${q.id===s.id?'active':''}" aria-label="${escape(q.name)}">${Cine.renderSVG(p,q.start+Math.floor((q.end-q.start)/2))}<div><b>${escape(q.name)}</b><small>${((q.end-q.start)/p.fps).toFixed(2)}s / ${(q.end-q.start)}f</small></div></button>`).join('');$('cineShots').querySelectorAll('button').forEach(b=>b.onclick=()=>{stop();seek(p.cinema.shots.find(q=>q.id===b.dataset.cineShot).start);});
 }
}
async function open(force=false){stop();S.stop();if(!S.read().project.cinema){if(!force&&!confirm('\u8f09\u5165\u65b0\u6848\u4f8b\uff1f\u76ee\u524d\u5c08\u6848\u53ef\u7531\u64a4\u92b7\u56de\u5fa9\uff0c\u5efa\u8b70\u5148\u5132\u5b58\u3002'))return;await S.load(Cine.makeDemo(Core.makeProject()));}localFrame=0;el.hidden=false;refresh();}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
btn.onclick=()=>open();$('cineClose').onclick=()=>{stop();el.hidden=true;};$('cinePlay').onclick=()=>{if(run)return stop();run=true;$('cinePlay').textContent='\u66ab\u505c';const p=S.read().project,start=performance.now(),first=localFrame;function tick(now){if(!run)return;const next=first+Math.floor((now-start)*p.fps/1000);if(next>=p.frames){seek(p.frames-1);return stop();}if(next!==localFrame)seek(next);raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);};
$('cineSeek').oninput=()=>{stop();seek(Number($('cineSeek').value));};$('cinePrev').onclick=()=>{stop();seek(Math.max(0,localFrame-1));};$('cineNext').onclick=()=>{stop();seek(Math.min(S.read().project.frames-1,localFrame+1));};
document.querySelectorAll('[data-cine-view]').forEach(b=>b.onclick=()=>{viewMode=b.dataset.cineView;document.querySelectorAll('[data-cine-view]').forEach(v=>v.classList.toggle('active',v===b));refresh();});
$('cineApplyCamera').onclick=()=>{const s=shot(),keys=Core.clone(s.camera),last=s.end-s.start-1;const values={x:Number($('cineCamX').value),y:Number($('cineCamY').value),zoom:Number($('cineCamZoom').value)};const existing=keys.find(k=>k.frame===last);if(existing)Object.assign(existing.values,values);else keys.push({frame:last,values,ease:'ease'});edit([{op:'cinema_set_camera',shot:s.id,keys}]);};
$('cineExposure').onchange=()=>{const s=shot(),l=s.layers.find(l=>['actor','pose','eyes'].includes(l.id));if(l)edit([{op:'cinema_set_exposure',shot:s.id,layer:l.id,hold:Number($('cineExposure').value)}]);};
$('cineSave').onclick=()=>save(new Blob([JSON.stringify(S.read().project,null,2)],{type:'application/json'}),'ember-gate.koma.json');$('cinePng').onclick=async()=>{const data=await S.frameData(localFrame);const bytes=Uint8Array.from(atob(data.split(',')[1]),c=>c.charCodeAt(0));save(new Blob([bytes],{type:'image/png'}),'ember-gate-'+localFrame+'.png');};
$('cineUndo').onclick=()=>document.getElementById('undo').click();$('cineRedo').onclick=()=>document.getElementById('redo').click();$('cineExport').onclick=()=>{stop();el.hidden=true;document.getElementById('openExport').click();};
window.addEventListener('keydown',e=>{if(el.hidden||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.getElementById('exportDialog').open)return;if(e.code==='Space'){e.preventDefault();$('cinePlay').click();}else if(e.key==='ArrowRight'){e.preventDefault();$('cineNext').click();}else if(e.key==='ArrowLeft'){e.preventDefault();$('cinePrev').click();}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('cineRedo'):$('cineUndo')).click();}});
window.KomaCinemaUI={open,refresh,seek:f=>{stop();seek(f);},get frame(){return localFrame;},get mode(){return viewMode;},onSeek:f=>{localFrame=f;refresh();}};
})();
</script>
</body></html>
