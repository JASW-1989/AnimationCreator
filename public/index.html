<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koma Studio 0.3 preview - Cinematic Study</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="plugin-ui.css"><link rel="stylesheet" href="cinema-ui.css"></head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">K</div><div>KOMA<span>STUDIO</span></div><small>0.3p</small></div><div class="project-title"><span class="project-dot"></span><span id="projectName">Neko - forest run</span><span class="subtle">/ SHOT 01</span></div><div class="top-actions"><span class="status-pill" id="mode">LOCAL</span><button id="openProject" data-testid="open-project"></button><button id="saveProject" data-testid="save-project"></button><button class="primary" id="openExport" data-testid="export-open"></button></div></header>
<div class="workspace">
<aside class="sidebar"><div class="section-title"><span id="sceneTitle"></span><span class="counter">01</span></div><div class="shot-card"><div id="shotThumb"></div><div class="shot-caption"><b>01 / FOREST RUN</b><span>00:04</span></div></div><div class="section-title layers-title"><span id="layersTitle"></span><span class="counter" id="layerCount">12</span></div><div id="layers" class="layers" role="list" aria-label="Scene layers"></div><button class="import-layer" id="importRaster"></button><div class="sidebar-note" id="localNote"></div></aside>
<main class="stage-column"><div class="stage-heading"><div><div class="eyebrow">NEKO / MOTION STUDY</div><h1 id="stageTitle"></h1></div><span class="technical-tag" id="fixtureTag"></span></div><div class="canvas-toolbar"><div class="segmented"><button id="selectTool" class="selected" data-testid="select-tool"></button><button id="maskTool" data-testid="mask-tool"></button></div><label class="check-control"><input type="checkbox" id="onion" data-testid="onion"><span id="onionLabel"></span></label><label class="check-control"><input type="checkbox" id="compare" data-testid="compare"><span id="compareLabel"></span></label><span class="toolbar-spacer"></span><span class="subtle">960 &times; 540</span></div><div class="viewport"><div class="stage-wrap" id="stageWrap"><div id="stage" data-testid="stage"></div><div id="onionStage" aria-hidden="true"></div><canvas id="maskCanvas" width="960" height="540" aria-label="Local repaint mask"></canvas><div class="frame-label" id="canvasFrame">F 005</div></div></div><div class="stage-footer"><span><i class="dot"></i><span id="renderNote"></span></span><span id="exposureSummary"></span></div></main>
<aside class="inspector"><div class="inspector-tabs" role="tablist"><button data-tab="animate" class="active" id="tabAnimate" role="tab"></button><button data-tab="plugins" id="tabPlugins" role="tab">&#25554;&#20214;</button><button data-tab="agent" id="tabAgent" role="tab"></button><button data-tab="patch" id="tabPatch" role="tab"></button></div><section id="animatePanel" class="panel"><div class="eyebrow" id="selectionLabel"></div><h2 id="selectedName"></h2><div class="field-label" id="exposureLabel"></div><div class="exposure-buttons" id="exposureButtons"><button data-exposure="1">1s</button><button data-exposure="2">2s</button><button data-exposure="3">3s</button></div><p class="help" id="exposureHelp"></p><div class="divider"></div><div class="field-label" id="transformLabel"></div><div class="fields"><label>X <input type="number" id="keyX" value="0" step="1"></label><label>Y <input type="number" id="keyY" value="0" step="1"></label><label id="rotationField">R <input type="number" id="keyRotation" value="0" step="1"></label><label>S <input type="number" id="keyScale" value="1" step=".05" min=".1" max="5"></label></div><label class="select-label"><span id="easingLabel"></span><select id="interpolation"><option value="linear">Linear</option><option value="ease">Ease in / out</option><option value="hold">Hold</option></select></label><button class="wide secondary" id="setKey" data-testid="set-key"></button><div id="drawingSection"><div class="field-label" id="drawingLabel"></div><div class="drawing-options" id="drawingOptions"></div></div><div class="divider"></div><div class="field-label" id="motionLabel"></div><div class="param"><label for="stride"><span id="strideLabel"></span><output id="strideValue"></output></label><input id="stride" type="range" min="20" max="100" step="1" data-param="stride"></div><div class="param"><label for="bounce"><span id="bounceLabel"></span><output id="bounceValue"></output></label><input id="bounce" type="range" min="0" max="24" step="1" data-param="bounce"></div><div class="param"><label for="tail"><span id="tailLabel"></span><output id="tailValue"></output></label><input id="tail" type="range" min="-40" max="40" step="1" data-param="tail"></div><label class="select-label"><span id="cycleLabel"></span><input id="cycle" type="number" min="8" max="96" step="1"></label></section>
<section id="pluginsPanel" class="panel hidden"></section><section id="agentPanel" class="panel hidden"><div class="eyebrow">AGENT BRIDGE</div><h2 id="agentTitle"></h2><p class="help" id="agentHelp"></p><div class="offline-box"><i class="dot"></i><span id="aiStatus"></span></div><label class="field-label" for="commandJson" id="commandLabel"></label><textarea id="commandJson" spellcheck="false" aria-label="Agent command JSON"></textarea><div class="agent-actions"><button class="secondary" id="previewPlan" data-testid="preview-plan"></button><button class="primary" id="commitPlan" disabled data-testid="commit-plan"></button></div><pre id="planDiff" class="diff-box"></pre><div class="divider"></div><div class="field-label" id="qaTitle"></div><div id="qaChecks"></div><button class="wide" id="copyState"></button></section>
<section id="patchPanel" class="panel hidden"><div class="eyebrow">LOCAL REPAINT</div><h2 id="patchTitle"></h2><p class="help" id="patchHelp"></p><div class="patch-steps"><b>01</b><span id="patchStep1"></span><button id="exportBase"></button><b>02</b><span id="patchStep2"></span><button id="startMask"></button><b>03</b><span id="patchStep3"></span><button id="loadCandidate"></button></div><div class="param"><label for="brushSize"><span id="brushLabel"></span><output id="brushValue">32 px</output></label><input id="brushSize" type="range" min="4" max="100" value="32"></div><button class="wide" id="clearMask"></button><div class="candidate-info" id="candidateInfo"></div><button class="wide primary" id="applyPatch" disabled data-testid="apply-patch"></button><p class="help warning" id="patchWarning"></p></section></aside>
</div>
<section class="timeline-section"><div class="timeline-main"><div class="transport"><button class="play" id="play" aria-label="Play animation" data-testid="play">&#9654;</button><button id="previous" aria-label="Previous frame">&#8249;</button><button id="next" aria-label="Next frame">&#8250;</button><span class="timecode" id="timecode"></span><span class="slash">/</span><span class="subtle">00:04:00</span><span class="spacer"></span><label class="loop-label"><input id="loop" type="checkbox" checked><span id="loopLabel"></span></label><span class="subtle">24 fps</span><div class="undo-group"><button id="undo" aria-label="Undo" data-testid="undo">&#8630;</button><button id="redo" aria-label="Redo" data-testid="redo">&#8631;</button></div></div><div class="timeline-scroll"><div class="ruler-row"><div class="track-heading" id="timelineLabel"></div><div id="ruler" class="ruler"></div></div><div id="tracks"></div></div><input class="scrubber" id="scrubber" aria-label="Current frame" type="range" min="0" max="95" value="4" step="1"></div><aside class="audit-panel"><div class="section-title"><span id="historyTitle"></span><code id="revision">r000</code></div><div id="history"></div></aside></section>
<footer class="statusbar"><span id="statusMessage"></span><span id="stats"></span><span>JSON + SVG + RASTER</span><span>NO MODEL CALLS</span></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="exportDialog"><div class="dialog-head"><div><div class="eyebrow">RENDER &amp; HANDOFF</div><h2 id="exportTitle"></h2></div><button id="closeExport" aria-label="Close">&#215;</button></div><p class="help" id="exportHelp"></p><div class="export-options"><button id="exportPng"><b>PNG</b><span id="exportPngLabel"></span></button><button id="exportSvg"><b>SVG</b><span id="exportSvgLabel"></span></button><button id="exportSequence"><b>PNG ZIP</b><span id="exportSequenceLabel"></span></button><button id="exportApng"><b>APNG</b><span>無損動畫／精確格時間</span></button><button id="exportWebm"><b>WebM</b><span id="exportWebmLabel"></span></button></div><button id="cancelExport" class="wide" hidden>Cancel current render</button><div id="exportProgress" class="help"></div><p class="help" id="exportMp4Note"></p></dialog>
<input type="file" id="projectFile" accept=".json" hidden><input type="file" id="rasterFile" accept="image/png,image/jpeg,image/webp" hidden><input type="file" id="candidateFile" accept="image/png,image/jpeg,image/webp" hidden>
<script src="session.js"></script><script src="plugins.js"></script><script src="cinema-art.js"></script><script src="cinema.js"></script><script src="production/pro.js"></script><script src="production/space.js"></script><script src="production/audio.js"></script><script src="production/atelier-paint.js"></script><script src="production/atelier.js"></script><script src="production/engine.js"></script><script src="core.js"></script><script src="vault.js"></script><script src="apng.js"></script><script src="app.js"></script><script src="plugin-ui.js"></script><script src="cinema-ui.js"></script>
</body></html>
